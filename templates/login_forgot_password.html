{% extends "base.html" %}
{% block title %}Forgot Password — EZ-Kea{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;">
  <div class="card">
    <div class="card-header"><h1 style="font-size:1.4rem;"><i data-lucide="mail"></i> Forgot Password</h1></div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1.25rem;">
          <label for="identifier" class="form-label">Username or Email</label>
          <input id="identifier" name="identifier" type="text" class="form-control" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;"><i data-lucide="send"></i> Send Reset Link</button>
      </form>
      <div style="text-align:center;margin-top:1rem;"><a href="{{ url_for('auth.login') }}" style="font-size:0.85rem;">← Back to login</a></div>
    </div>
  </div>
</div>
{% endblock %}
