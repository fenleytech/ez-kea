{% extends "base.html" %}
{% block title %}Verification — EZ-Kea{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;">
  <div class="card">
    <div class="card-header"><h1 style="font-size:1.4rem;"><i data-lucide="shield-check"></i> Two-Factor Auth</h1></div>
    <div class="card-body">
      <p style="opacity:0.8;margin-bottom:1.25rem;">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
      <form method="POST" action="{{ url_for('auth.login_2fa') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1.25rem;">
          <label for="code" class="form-label">Code</label>
          <input id="code" name="code" type="text" class="form-control" inputmode="numeric" autocomplete="one-time-code" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;"><i data-lucide="log-in"></i> Verify</button>
      </form>
      <div style="text-align:center;margin-top:1rem;">
        <a href="{{ url_for('auth.login_2fa_cancel') }}" style="font-size:0.85rem;">← Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
