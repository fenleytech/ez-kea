{% extends "base.html" %}
{% block title %}Recovery Codes — EZ-Kea{% endblock %}
{% block content %}
<div style="max-width:500px;margin:4rem auto;">
  <div class="card">
    <div class="card-header"><h1 style="font-size:1.4rem;"><i data-lucide="key"></i> Save Your Recovery Codes</h1></div>
    <div class="card-body">
      <div class="alert alert-warning"><i data-lucide="alert-triangle"></i> These codes will <strong>never be shown again</strong>. Store them somewhere safe.</div>
      <div style="font-family:monospace;font-size:1.1rem;line-height:2.2;padding:1rem;background:rgba(0,0,0,0.2);border-radius:8px;margin-bottom:1.25rem;">
        {% for code in codes %}<div>{{ code }}</div>{% endfor %}
      </div>
      <form method="POST" action="{{ url_for('auth.login_recovery_codes') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-primary" style="width:100%;"><i data-lucide="check"></i> I've saved these — Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
