{% extends "base.html" %}
{% block title %}Reset Password — EZ-Kea{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;">
  <div class="card">
    <div class="card-header"><h1 style="font-size:1.4rem;"><i data-lucide="lock"></i> Reset Password</h1></div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.reset_password', uid=uid, token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1rem;">
          <label for="password" class="form-label">New Password</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;"><i data-lucide="check"></i> Set New Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
