[pytest]
# Collect only from tests/. Without this, a bare `python -m pytest` also walks
# testbed/data/, which holds runtime state the Kea container writes as root --
# the 3.2 target's /var/log/kea is mode 750 root:root, and pytest aborts the
# whole run with a PermissionError trying to stat it. There are no Python tests
# under testbed/ anyway; its suite is testbed/test_suite.sh.
testpaths = tests
