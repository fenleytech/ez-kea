# demo.ezkea.com — reverse proxy for the EZ-Kea public demo.
#
# Sits behind Cloudflare (the host firewall only admits Cloudflare ranges), so
# this config assumes every request arrives via the CDN. The caching and rate
# limits below exist to keep origin egress inside the GCP free tier's 1 GB/month
# North America allowance.

proxy_cache_path /var/cache/nginx/ezkea levels=1:2 keys_zone=ezkea_static:10m
                 max_size=200m inactive=30d use_temp_path=off;

# Per-visitor limits. Cloudflare's CF-Connecting-IP is restored to
# $remote_addr below, so these apply to real clients, not to Cloudflare edges.
limit_req_zone  $binary_remote_addr zone=ezkea_req:10m  rate=8r/s;
limit_conn_zone $binary_remote_addr zone=ezkea_conn:10m;

# Serves on both 80 and 443 rather than redirecting 80 -> 443. Cloudflare's
# SSL mode decides which one it dials: "Flexible" uses 80, "Full" uses 443. A
# redirect here would loop forever under Flexible, so the edge is left to
# enforce public HTTPS ("Always Use HTTPS") and both ports answer identically.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.ezkea.com;

    ssl_certificate     /etc/nginx/ssl/demo.ezkea.com.crt;
    ssl_certificate_key /etc/nginx/ssl/demo.ezkea.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Trust Cloudflare's forwarded client IP. Ranges are written by
    # /usr/local/sbin/update-cloudflare-ips and refreshed weekly.
    include /etc/nginx/cloudflare-real-ip.conf;

    # A demo has no business being indexed, and crawlers are pure egress cost.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Static assets: cached at nginx AND marked cacheable so Cloudflare serves
    # most of them without touching the origin at all.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache ezkea_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;

        # Flask sends "Cache-Control: no-cache" on static files by default
        # (Flask 2.0+), which stops both nginx and Cloudflare from caching them.
        # These assets are versioned by deploy, so override it: this is the
        # single biggest lever on origin egress.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        limit_conn ezkea_conn 16;
    }

    location / {
        limit_req  zone=ezkea_req burst=24 nodelay;
        limit_conn ezkea_conn 16;

        # Ceiling on per-connection bandwidth. Ample for a config UI; blunts
        # anyone trying to drain the monthly egress allowance.
        limit_rate 1m;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/demo.ezkea.com.access.log;
    error_log  /var/log/nginx/demo.ezkea.com.error.log;
}
